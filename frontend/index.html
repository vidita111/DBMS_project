<div id="login">

<form class="lcard" id="lf" autocomplete="off">
<h1 id="lt">LOG IN</h1>
<label for="role">Sign in as</label><select id="role"><option value="admin">Admin</option><option value="portal">Student / Invigilator</option></select>
<label for="u">Username</label><input id="u" placeholder="Enter your username" autofocus>
<label for="p">Password</label><div class="pw"><input id="p" type="password" placeholder="Enter your password"><button type="button" id="eye" aria-label="Show password">&#128065;</button></div>
<div class="err" id="le"></div>
<button class="go" id="lb">Sign In</button>
<p><span id="lq">Don’t have an account?</span><a id="ls">Sign Up</a></p>
</form></div>

<div id="app"><aside id="side">
<button class="dots" id="dots" aria-label="Toggle menu">&#8942;</button>
<div class="usr"><div class="av"></div><b id="un">TEST</b></div>
<nav id="nav"></nav><button class="out" id="out">Log Out</button></aside>
<main id="main"></main></div>
